name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Set MOAT_VERSION environment variable
env:
  MOAT_VERSION: ${{ github.ref_name }}

jobs:

  # Linux binaries must be built against the oldest glibc we support (RHEL 9,
  # glibc 2.34): PyInstaller bundles libpython from the build interpreter, and
  # that library records the newest versioned glibc symbols it references. A
  # binary built on a newer host (e.g. ubuntu-22.04, glibc 2.35) fails on older
  # glibc with "GLIBC_2.35 not found".
  #
  # PyInstaller additionally requires an interpreter with a shared libpython
  # (--enable-shared); otherwise it aborts with "Python was built without a
  # shared library". The CPython builds shipped in the container's /opt/python
  # are static-only, so the build compiles its own CPython via pyenv *inside
  # the container*: compiling there (rather than on the runner host) keeps the
  # bundled libpython free of glibc symbols newer than 2.34.
  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            image: quay.io/pypa/manylinux_2_34_x86_64
          - runner: ubuntu-26.04-arm
            arch: arm64
            image: quay.io/pypa/manylinux_2_34_aarch64
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install CPython build dependencies
        run: |
          yum install -y \
            zlib-devel bzip2-devel xz-devel sqlite-devel readline-devel \
            ncurses-devel libffi-devel openssl-devel gdbm-devel tk-devel

      - name: Install pyenv and build a shared-library Python
        env:
          PY_VERSION: '3.15.2'
        run: |
          git clone --depth 1 https://github.com/pyenv/pyenv.git "$HOME/.pyenv"
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"
          env PYTHON_CONFIGURE_OPTS="--enable-shared" PYTHON_MAKE_OPTS="-j$(nproc)" \
            pyenv install "$PY_VERSION"
          echo "PYROOT=$PYENV_ROOT/versions/$PY_VERSION" >> "$GITHUB_ENV"

      - name: Install requirements
        run: |
          "$PYROOT/bin/python" -m pip install --upgrade pip
          "$PYROOT/bin/python" -m pip install . --group dev

      - name: Build executable
        run: |
          "$PYROOT/bin/pyinstaller" --onefile --name moat-install \
            --hiddenimport certifi \
            --runtime-hook=hooks/pyi_rth_ca_certs.py moat_install/__main__.py

      - name: Copy LICENSE and README.md to dist
        run: cp LICENSE README.md dist/

      - name: Create names for the artifacts
        run: |
          echo "MOAT_INSTALL_TAR=moat-install_Linux_${{ matrix.arch }}.tar.gz" >> $GITHUB_ENV
          echo "MOAT_INSTALL_ARTIFACT=moat-install_${GITHUB_REF#refs/tags/v}_Linux_${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Tar up the release
        working-directory: dist
        run: tar -c -f ${{ env.MOAT_INSTALL_TAR }} moat-install LICENSE README.md

      - name: Upload built release as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MOAT_INSTALL_ARTIFACT }}
          path: dist/${{ env.MOAT_INSTALL_TAR }}

  build-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-26-intel
            arch: x86_64
          - runner: macos-latest
            arch: arm64

    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install requirements
        run: python -m pip install . --group dev

      - name: Build executable
        run: |
          pyinstaller --onefile --name moat-install --hiddenimport certifi \
            --runtime-hook=hooks/pyi_rth_ca_certs.py moat_install/__main__.py

      - name: Copy LICENSE and README.md to dist
        run: cp LICENSE README.md dist/

      - name: Create names for the artifacts
        run: |
          echo "MOAT_INSTALL_TAR=moat-install_Darwin_${{ matrix.arch }}.tar.gz" >> $GITHUB_ENV
          echo "MOAT_INSTALL_ARTIFACT=moat-install_${GITHUB_REF#refs/tags/v}_Darwin_${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Tar up the release
        working-directory: dist
        run: tar -c -f ${{ env.MOAT_INSTALL_TAR }} moat-install LICENSE README.md

      - name: Upload built release as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MOAT_INSTALL_ARTIFACT }}
          path: dist/${{ env.MOAT_INSTALL_TAR }}

  release:
    name: Build release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos]

    steps:

      - name: Get tag
        run: |
          echo "MOAT_INSTALL_TAG=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: moat-install_${{ env.MOAT_INSTALL_TAG }}_*
          merge-multiple: true

      - name: Calculate checksum
        run: sha256sum * > moat-install_${GITHUB_REF#refs/tags/v}_checksums.txt
        working-directory: dist

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          working_directory: dist
          files: |
            *.tar.gz
            *_checksums.txt
